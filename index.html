<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{
      --primary:#0e7c66;
      --primary-dark:#0a5c4c;
      --bg:#f4f7f6;
      --card:#ffffff;
      --border:#dfe6e4;
      --text:#1f2b29;
      --muted:#6b7a77;
    }
    *{box-sizing:border-box;}
    body{
      font-family:'Sarabun','Segoe UI',sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      padding:16px;
      max-width:520px;
      margin-left:auto;
      margin-right:auto;
    }
    h1{font-size:20px;margin:0 0 4px;}
    .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:16px;
      margin-bottom:14px;
    }
    label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px;}
    label:first-child{margin-top:0;}
    input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
      width:100%;
      padding:10px;
      border:1px solid var(--border);
      border-radius:8px;
      font-size:15px;
      font-family:inherit;
      background:#fff;
    }
    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:var(--primary);
      color:#fff;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      margin-top:8px;
    }
    button:active{background:var(--primary-dark);}
    button.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
    .hidden{display:none !important;}
    .category{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
    .category:first-child{border-top:none;margin-top:0;padding-top:0;}
    .category-title{font-weight:700;font-size:14px;color:var(--primary-dark);margin-bottom:6px;}
    .item-row{
      display:flex;
      align-items:flex-start;
      gap:8px;
      padding:6px 0;
    }
    .item-row input[type=checkbox]{
      width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--primary);
    }
    .item-body{flex:1;}
    .item-label{font-size:14px;}
    .item-detail{margin-top:4px;}
    .item-detail input, .item-detail select{font-size:13px;padding:7px;}
    .msg{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;}
    .msg.ok{background:#e4f5ef;color:#0a5c4c;}
    .msg.err{background:#fdeaea;color:#a33;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    .who{font-size:13px;color:var(--muted);}
    a.linklike{color:var(--primary);font-size:13px;}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

  <h1>บันทึกการดูแลผู้ป่วย</h1>
  <div class="sub">CMCC Home Care by CMNH</div>

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <label>รหัสผู้ดูแล</label>
    <input type="password" id="caregiverCode" placeholder="กรอกรหัสของคุณ" inputmode="numeric">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <div id="loginMsg"></div>
  </div>

  <!-- MAIN -->
  <div id="mainSection" class="hidden">
    <div class="topbar">
      <div class="who">ผู้ดูแล: <b id="caregiverNameLabel"></b></div>
      <a class="linklike" href="#" onclick="logout();return false;">ออกจากระบบ</a>
    </div>

    <div class="card">
      <label>เลือกคนไข้</label>
      <select id="patientSelect" onchange="onPatientChange()">
        <option value="">-- เลือกคนไข้ --</option>
      </select>

      <label>วันที่</label>
      <input type="date" id="recordDate">

      <label>เวลา</label>
      <input type="time" id="recordTime">
    </div>

    <div id="checklistCard" class="card hidden">
      <div id="checklistContainer"></div>
      <button onclick="submitChecklist()" id="submitBtn">บันทึกรายการที่ติ๊กไว้</button>
      <div id="submitMsg"></div>
    </div>

    <div class="card">
      <label>สร้างรายงานสรุปประจำวัน (PDF)</label>
      <div class="sub" style="margin-bottom:8px;">ระบบจะรวมทุกรายการที่บันทึกไว้ในวันที่เลือก เป็นไฟล์ PDF ให้แอดมินดาวน์โหลดไปส่งกลุ่ม LINE ญาติ</div>
      <button class="secondary" onclick="createReport()">สร้างรายงาน PDF ของวันนี้</button>
      <div id="reportMsg"></div>
    </div>
  </div>

<script>
  // -----------------------------------------------------------------------
  // ตั้งค่ารายการที่ให้ติ๊กในแต่ละหมวด — แก้ไข/เพิ่มลดได้ตรงนี้จุดเดียว
  // type: 'check' = ติ๊กเฉยๆ, 'select' = ติ๊กแล้วเลือกจากลิสต์, 'text' = ติ๊กแล้วพิมพ์รายละเอียด
  // -----------------------------------------------------------------------
  const CATEGORY_CONFIG = [
    { key: 'nutrition', title: 'โภชนาการ / น้ำ', items: [
      { key: 'meal', label: 'ทานอาหารแล้ว', type: 'select', options: ['ทานหมด','ทานได้ครึ่งหนึ่ง','ทานได้เล็กน้อย','ไม่ทาน'] },
      { key: 'water', label: 'ดื่มน้ำ/ของเหลวแล้ว', type: 'check' }
    ]},
    { key: 'medicine', title: 'ยา', items: [
      { key: 'med', label: 'ทานยาแล้ว', type: 'text' /* ระบุชื่อ/มื้อยา */ }
    ]},
    { key: 'excretion', title: 'ขับถ่าย', items: [
      { key: 'urine', label: 'ปัสสาวะแล้ว', type: 'select', options: ['ปกติ','สีเข้ม/ผิดปกติ'] },
      { key: 'stool', label: 'อุจจาระแล้ว', type: 'select', options: ['ปกติ','ท้องเสีย','ท้องผูก'] }
    ]},
    { key: 'hygiene', title: 'สุขอนามัย', items: [
      { key: 'bath', label: 'เช็ดตัว/อาบน้ำแล้ว', type: 'check' },
      { key: 'oral', label: 'แปรงฟัน/ทำความสะอาดช่องปาก', type: 'check' },
      { key: 'diaper', label: 'เปลี่ยนผ้าอ้อม/ทำความสะอาดจุดซับ', type: 'check' }
    ]},
    { key: 'mobility', title: 'การเคลื่อนไหว / ป้องกันแผลกดทับ', items: [
      { key: 'turn', label: 'พลิกตัว/เปลี่ยนท่า', type: 'check' },
      { key: 'physio', label: 'ทำกายภาพ/ขยับข้อ', type: 'check' },
      { key: 'walk', label: 'ลุกเดิน/นั่งรถเข็น', type: 'check' }
    ]},
    { key: 'vitals', title: 'สัญญาณชีพ', items: [
      { key: 'bp', label: 'ความดันโลหิต', type: 'text' },
      { key: 'pulse_temp', label: 'ชีพจร/อุณหภูมิ', type: 'text' },
      { key: 'spo2', label: 'ออกซิเจนปลายนิ้ว (SpO2)', type: 'text' },
      { key: 'sugar', label: 'ระดับน้ำตาลในเลือด', type: 'text' }
    ]},
    { key: 'devices', title: 'อุปกรณ์ทางการแพทย์', items: [
      { key: 'ng', label: 'ตรวจ/ดูแลสายให้อาหาร (NG tube)', type: 'check' },
      { key: 'foley', label: 'ตรวจ/ดูแลสายสวนปัสสาวะ (Foley)', type: 'check' },
      { key: 'wound', label: 'ตรวจแผลกดทับ/บาดแผล', type: 'text' }
    ]},
    { key: 'general', title: 'สภาพทั่วไป', items: [
      { key: 'sleep', label: 'นอนหลับพักผ่อน', type: 'check' },
      { key: 'mood', label: 'อารมณ์/สภาพจิตใจ', type: 'select', options: ['ร่าเริง','ปกติ','ซึม','กระสับกระส่าย'] }
    ]},
    { key: 'incident', title: 'เหตุการณ์พิเศษ', items: [
      { key: 'fall', label: 'มีอุบัติเหตุ/พลัดตกหกล้ม', type: 'text' },
      { key: 'symptom', label: 'อาการผิดปกติ (ไข้ ไอ หายใจลำบาก ฯลฯ)', type: 'text' },
      { key: 'note', label: 'หมายเหตุเพิ่มเติม', type: 'text' }
    ]}
  ];

  let caregiverName = '';
  let patients = [];
  let currentPatient = null;

  // ลิงก์ Apps Script Web App (deploy แบบ Anyone) — !!! แก้เป็นลิงก์ .../exec จริงของคุณก่อนใช้งาน !!!
  const GAS_API_URL = 'ใส่ลิงก์ .../exec ของคุณตรงนี้';

  // อ่านข้อมูล (GET) — ?action=xxx&...
  function gasGet_(params) {
    const qs = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(GAS_API_URL + '?' + qs).then(function (r) { return r.json(); });
  }

  // เขียนข้อมูล (POST) — ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script รองรับไม่ได้
  function gasPost_(body) {
    return fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function todayStr(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function nowTimeStr(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }

  // ---------------- Login ----------------
  function login(){
    const code = document.getElementById('caregiverCode').value.trim();
    if(!code){ showMsg('loginMsg','กรุณากรอกรหัส','err'); return; }

    showMsg('loginMsg','กำลังตรวจสอบ...','ok');
    gasGet_({ action: 'verify', code: code }).then(function(res){
      if(res.success){
        caregiverName = res.name;
        document.getElementById('caregiverNameLabel').textContent = caregiverName;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('recordDate').value = todayStr();
        document.getElementById('recordTime').value = nowTimeStr();
        loadPatients();
      } else {
        showMsg('loginMsg', res.message || 'รหัสไม่ถูกต้อง', 'err');
      }
    }).catch(function(err){
      showMsg('loginMsg', 'เชื่อมต่อไม่ได้: '+err.message, 'err');
    });
  }

  function logout(){
    location.reload();
  }

  // ---------------- Patients ----------------
  function loadPatients(){
    gasGet_({ action: 'patients' }).then(function(res){
      const list = res.patients || res; // เผื่อ backend คืนเป็น array ตรงๆ
      patients = list;
      const sel = document.getElementById('patientSelect');
      sel.innerHTML = '<option value="">-- เลือกคนไข้ --</option>';
      list.forEach(function(p){
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + (p.zone ? ' ('+p.zone+')' : '');
        sel.appendChild(opt);
      });
    }).catch(function(err){
      alert('โหลดรายชื่อคนไข้ไม่สำเร็จ: '+err.message);
    });
  }

  function onPatientChange(){
    const name = document.getElementById('patientSelect').value;
    currentPatient = patients.find(p => p.name === name) || null;
    const checklistCard = document.getElementById('checklistCard');
    if(!currentPatient){
      checklistCard.classList.add('hidden');
      return;
    }
    renderChecklist(currentPatient);
    checklistCard.classList.remove('hidden');
  }

  // ---------------- Checklist ----------------
  function renderChecklist(patient){
    const container = document.getElementById('checklistContainer');
    container.innerHTML = '';
    const allowed = patient.categories; // null = ทุกหมวด

    CATEGORY_CONFIG.forEach(function(cat){
      if(allowed && allowed.indexOf(cat.key) === -1) return;

      const catDiv = document.createElement('div');
      catDiv.className = 'category';
      const titleDiv = document.createElement('div');
      titleDiv.className = 'category-title';
      titleDiv.textContent = cat.title;
      catDiv.appendChild(titleDiv);

      cat.items.forEach(function(item){
        const row = document.createElement('div');
        row.className = 'item-row';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'chk_' + cat.key + '_' + item.key;
        cb.dataset.cat = cat.key;
        cb.dataset.catTitle = cat.title;
        cb.dataset.item = item.key;
        cb.dataset.itemLabel = item.label;

        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'item-body';

        const lbl = document.createElement('div');
        lbl.className = 'item-label';
        lbl.textContent = item.label;

        bodyDiv.appendChild(lbl);

        let detailEl = null;
        if(item.type === 'select'){
          detailEl = document.createElement('select');
          detailEl.className = 'item-detail hidden';
          const blank = document.createElement('option');
          blank.value=''; blank.textContent='-- เลือก --';
          detailEl.appendChild(blank);
          item.options.forEach(function(opt){
            const o = document.createElement('option');
            o.value = opt; o.textContent = opt;
            detailEl.appendChild(o);
          });
          bodyDiv.appendChild(detailEl);
        } else if(item.type === 'text'){
          detailEl = document.createElement('input');
          detailEl.type = 'text';
          detailEl.className = 'item-detail hidden';
          detailEl.placeholder = 'รายละเอียด...';
          bodyDiv.appendChild(detailEl);
        }

        if(detailEl){
          cb.addEventListener('change', function(){
            detailEl.classList.toggle('hidden', !cb.checked);
          });
          cb.dataset.hasDetail = '1';
        }

        row.appendChild(cb);
        row.appendChild(bodyDiv);
        catDiv.appendChild(row);
      });

      container.appendChild(catDiv);
    });
  }

  // ---------------- Submit ----------------
  function submitChecklist(){
    if(!currentPatient){ return; }
    const date = document.getElementById('recordDate').value;
    const time = document.getElementById('recordTime').value;
    if(!date || !time){ showMsg('submitMsg','กรุณาเลือกวันที่และเวลา','err'); return; }

    const checkboxes = document.querySelectorAll('#checklistContainer input[type=checkbox]:checked');
    if(checkboxes.length === 0){ showMsg('submitMsg','ยังไม่ได้ติ๊กเลือกรายการใดเลย','err'); return; }

    const items = [];
    checkboxes.forEach(function(cb){
      const row = cb.closest('.item-row');
      const detailEl = row.querySelector('.item-detail');
      items.push({
        category: cb.dataset.catTitle,
        item: cb.dataset.itemLabel,
        detail: detailEl ? detailEl.value : ''
      });
    });

    const payload = {
      patientName: currentPatient.name,
      date: date,
      time: time,
      caregiverName: caregiverName,
      items: items
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก...';

    gasPost_({ action: 'submitRecord', payload: payload }).then(function(res){
      btn.disabled = false;
      btn.textContent = 'บันทึกรายการที่ติ๊กไว้';
      if(res.success){
        showMsg('submitMsg', 'บันทึกสำเร็จ ('+res.count+' รายการ)', 'ok');
        // เคลียร์ติ๊กหลังบันทึกสำเร็จ เพื่อรอรอบเวลาถัดไป
        document.querySelectorAll('#checklistContainer input[type=checkbox]').forEach(function(cb){
          cb.checked = false;
          const row = cb.closest('.item-row');
          const detailEl = row.querySelector('.item-detail');
          if(detailEl){ detailEl.value=''; detailEl.classList.add('hidden'); }
        });
      } else {
        showMsg('submitMsg', res.message || 'บันทึกไม่สำเร็จ', 'err');
      }
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = 'บันทึกรายการที่ติ๊กไว้';
      showMsg('submitMsg', 'เชื่อมต่อไม่ได้: '+err.message, 'err');
    });
  }

  // ---------------- Daily report ----------------
  function createReport(){
    if(!currentPatient){ showMsg('reportMsg','กรุณาเลือกคนไข้ก่อน','err'); return; }
    const date = document.getElementById('recordDate').value || todayStr();
    showMsg('reportMsg','กำลังสร้างรายงาน...','ok');
    gasPost_({ action: 'generateReport', patientName: currentPatient.name, date: date }).then(function(res){
      if(res.success){
        document.getElementById('reportMsg').innerHTML =
          '<div class="msg ok">สร้างรายงานสำเร็จ — <a class="linklike" href="'+res.viewUrl+'" target="_blank">เปิด/ดาวน์โหลด PDF</a></div>';
      } else {
        showMsg('reportMsg', res.message || 'สร้างรายงานไม่สำเร็จ', 'err');
      }
    }).catch(function(err){
      showMsg('reportMsg', 'เชื่อมต่อไม่ได้: '+err.message, 'err');
    });
  }

  // ---------------- Helpers ----------------
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg '+type+'">'+text+'</div>';
  }
</script>
</body>
</html>
