<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CMCC โฮมแคร์ · บันทึกการดูแล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#EEF3EE;
    --surface:#FFFFFF;
    --ink:#1E2E29;
    --ink-soft:#5B6A63;
    --teal:#2C6E6B;
    --teal-dark:#1B4A48;
    --teal-tint:#E1EEEC;
    --amber:#E2963A;
    --amber-tint:#FBEEDA;
    --rose:#C1685C;
    --rose-tint:#F6E6E3;
    --line:#D8E1DB;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;padding-bottom:48px;}

  .topbar{background:var(--teal-dark);color:#fff;padding:18px 18px 20px;border-radius:0 0 20px 20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:38px;height:38px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal-dark);font-size:15px;flex-shrink:0;}
  .brand h1{font-size:16px;margin:0;font-weight:600;line-height:1.3;}
  .brand p{margin:1px 0 0;font-size:11.5px;color:#CFE3E1;}

  /* home landing */
  .homeGrid{display:flex;flex-direction:column;gap:12px;padding:18px 16px 6px;}
  .homeCard{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;width:100%;}
  .homeCard .hIcon{width:46px;height:46px;border-radius:12px;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .homeCard .hBody{flex:1;min-width:0;}
  .homeCard .hTitle{font-size:15px;font-weight:700;color:var(--ink);}
  .homeCard .hSub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .homeCard .hArrow{color:var(--ink-soft);font-size:18px;}

  .backRow{display:flex;align-items:center;gap:10px;padding:16px 16px 4px;}
  .backBtn{border:none;background:var(--teal-tint);color:var(--teal-dark);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0;}
  .formTitle{font-size:15px;font-weight:700;}

  .section{padding:16px 16px 4px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:10px 0 6px;font-weight:500;}
  label:first-child{margin-top:0;}
  label.groupLabel{margin-top:18px;font-weight:700;color:var(--teal-dark);font-size:13px;}
  select, input[type=text], input[type=number], input[type=time], input[type=date], textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:64px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;}
  .chip.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip.warn.selected{background:var(--rose);border-color:var(--rose);}

  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-secondary{background:var(--teal-tint);color:var(--teal-dark);}
  .btn-amber{background:var(--amber);color:#472B04;}
  .btn-ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  .tabs{display:flex;gap:8px;padding:0 16px 10px;}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink-soft);padding:10px 4px;border-radius:10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;}
  .tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  .listRow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;}
  .listRow:first-child{border-top:none;}
  .listRow .name{font-size:14px;font-weight:600;}
  .listRow .meta{font-size:12px;color:var(--ink-soft);}
  .iconbtn{border:none;background:var(--rose-tint);color:var(--rose);border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0;}

  .empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:13.5px;}

  /* patient picker */
  .pickRow{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:inherit;cursor:pointer;text-align:left;}
  .pickRow.picked{border-color:var(--teal);background:var(--teal-tint);}
  .pickRow .prName{font-size:14px;font-weight:600;color:var(--ink);}
  .pickRow .prMeta{font-size:12px;color:var(--ink-soft);}

  .infoBanner{background:var(--teal-tint);color:var(--teal-dark);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.6;}
  .infoBanner.warn{background:var(--rose-tint);color:var(--rose);}

  /* action grid (caregiver home) */
  .actionGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .actionBtn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;font-family:inherit;}
  .actionBtn .ic{font-size:22px;display:block;margin-bottom:6px;}
  .actionBtn .lb{font-size:12.5px;font-weight:600;color:var(--ink);}

  /* feed */
  .feedItem{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
  .feedItem:first-child{border-top:none;}
  .feedItem .ic{width:34px;height:34px;border-radius:10px;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .feedItem.flag .ic{background:var(--rose-tint);}
  .feedItem .body{flex:1;min-width:0;}
  .feedItem .top{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .feedItem .txt{font-size:13.5px;color:var(--ink);line-height:1.5;}

  /* medication rows */
  .medRow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .medRow .mname{font-size:13.5px;font-weight:600;}
  .medRow .mdose{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .medStatusRow{display:flex;gap:8px;}
  .medStatusRow .chip{flex:1;text-align:center;padding:8px 6px;font-size:12.5px;}

  /* badges */
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;margin:2px 4px 2px 0;}
  .badge-ok{background:var(--teal-tint);color:var(--teal-dark);}
  .badge-warn{background:var(--rose-tint);color:var(--rose);}
  .badge-neutral{background:#EEF1EF;color:var(--ink-soft);}

  /* dashboard */
  .dashSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .dashSummary .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .dashSummary .num{font-size:20px;font-weight:700;color:var(--teal-dark);}
  .dashSummary .lb{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .dashRow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .dashRow .name{font-size:14px;font-weight:700;}
  .dashRow .sub{font-size:11.5px;color:var(--ink-soft);margin:2px 0 6px;}

  /* report card */
  #reportWrap{padding:0 16px;}
  #reportCard{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);}
  .rc-head{background:var(--teal);color:#fff;padding:18px;}
  .rc-head .rc-brand{font-size:11px;letter-spacing:.3px;color:#CFE3E1;margin-bottom:6px;}
  .rc-head .rc-name{font-size:19px;font-weight:700;}
  .rc-head .rc-sub{font-size:12.5px;color:#D9EAE8;margin-top:3px;}
  .rc-alert{margin-top:8px;font-size:11.5px;background:rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;}
  .rc-body{padding:16px 18px 20px;}
  .rc-sec{margin-bottom:16px;}
  .rc-sec:last-child{margin-bottom:0;}
  .rc-sec-title{font-size:12.5px;font-weight:700;color:var(--teal-dark);border-left:3px solid var(--amber);padding-left:8px;margin-bottom:8px;}
  .rc-visit{background:var(--teal-tint);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .rc-visit .t{font-weight:700;color:var(--teal-dark);margin-bottom:3px;}
  .rc-visit .row{display:flex;justify-content:space-between;color:var(--ink);}
  .rc-visit .who{color:var(--ink-soft);margin-top:3px;font-size:11.5px;}
  .rc-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .rc-foot{padding:12px 18px;background:var(--bg);font-size:10.5px;color:var(--ink-soft);display:flex;justify-content:space-between;}

  @media print{
    body *{visibility:hidden;}
    #reportCard, #reportCard *{visibility:visible;}
    #reportCard{position:absolute;top:0;left:0;width:100%;border:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">CC</div>
      <div>
        <h1>CMCC โฮมแคร์</h1>
        <p>บันทึกการดูแลผู้สูงอายุที่บ้าน</p>
      </div>
    </div>
  </div>
  <div id="navArea"></div>
  <div id="mainContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============== CONFIG ============== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbz8ZvPCQftgLdolOBaBoM9llE_YUKHHg5lQIX700gSROwtux3lAlc5O8ftSla--hXhV/exec'
};

/* ============== API HELPERS ============== */
function apiConfigured(){
  return CONFIG.API_URL && CONFIG.API_URL.indexOf('https://script.google.com') === 0;
}
async function apiGet(action, params){
  if(!apiConfigured()) return [];
  const url = new URL(CONFIG.API_URL);
  url.searchParams.set('action', action);
  if(params) Object.keys(params).forEach(k=>{ if(params[k]!==undefined && params[k]!=='') url.searchParams.set(k, params[k]); });
  try{
    const res = await fetch(url.toString());
    const json = await res.json();
    if(json && json.error){ console.error(json.error); return action==='getDashboard' ? {patients:[]} : []; }
    return json;
  }catch(e){ console.error('apiGet error', e); showToast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); return action==='getDashboard' ? {patients:[]} : []; }
}
async function apiPost(action, data){
  if(!apiConfigured()){ showToast('ยังไม่ได้ตั้งค่า API_URL'); return {success:false}; }
  try{
    const res = await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, data})
    });
    const json = await res.json();
    if(json && json.error){ console.error(json.error); showToast('เกิดข้อผิดพลาด: '+json.error); }
    return json;
  }catch(e){ console.error('apiPost error', e); showToast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); return {success:false}; }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(iso){
  const d=new Date(iso+'T00:00:00');
  const days=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `วัน${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function calcAge(dobStr){
  if(!dobStr) return '';
  const dob=new Date(dobStr);
  const today=new Date();
  let age=today.getFullYear()-dob.getFullYear();
  const m=today.getMonth()-dob.getMonth();
  if(m<0 || (m===0 && today.getDate()<dob.getDate())) age--;
  return age>=0 ? age : '';
}

/* ============== DATA CACHE / PRELOAD ============== */
let patients=[], caregivers=[];
let preloadPromise=null;
async function loadAll(){
  if(!apiConfigured()){ patients=[]; caregivers=[]; return; }
  const [p, c] = await Promise.all([apiGet('getPatients'), apiGet('getCaregivers')]);
  patients = p; caregivers = c;
}
function preloadData(){
  if(!preloadPromise) preloadPromise = loadAll();
  return preloadPromise;
}
async function ensureData(){ await preloadData(); }

/* ============== NAVIGATION ============== */
let currentView='home';
let cgState = { patientId:'', caregiverName:'', action:null };
let adminTab='report';

async function goTo(view){
  currentView=view;
  if(view==='caregiver') cgState.action=null;
  await renderApp();
}

function homeGridHtml(){
  return `
    <div class="homeGrid">
      <button type="button" class="homeCard" data-view="caregiver">
        <div class="hIcon">🧑‍⚕️</div>
        <div class="hBody"><div class="hTitle">ผู้ดูแล</div><div class="hSub">บันทึกการเยี่ยมบ้านประจำวัน</div></div>
        <div class="hArrow">›</div>
      </button>
      <button type="button" class="homeCard" data-view="admin">
        <div class="hIcon" style="background:var(--amber-tint);">🗂️</div>
        <div class="hBody"><div class="hTitle">แอดมิน</div><div class="hSub">รายงานประจำวัน · จัดการรายชื่อ</div></div>
        <div class="hArrow">›</div>
      </button>
      <button type="button" class="homeCard" data-view="dashboard">
        <div class="hIcon" style="background:var(--rose-tint);">📊</div>
        <div class="hBody"><div class="hTitle">แดชบอร์ด</div><div class="hSub">ภาพรวมทุกเคสวันนี้</div></div>
        <div class="hArrow">›</div>
      </button>
    </div>
  `;
}
function viewTitleFor(v){ return {caregiver:'ผู้ดูแล (บันทึก)', admin:'แอดมิน', dashboard:'แดชบอร์ด'}[v]||''; }

async function renderApp(){
  const nav=document.getElementById('navArea');
  const main=document.getElementById('mainContent');
  if(currentView==='home'){
    nav.innerHTML = homeGridHtml();
    main.innerHTML = '';
    nav.querySelectorAll('.homeCard').forEach(c=>{ c.onclick=()=>goTo(c.dataset.view); });
    return;
  }
  nav.innerHTML = `<div class="backRow"><button class="backBtn" id="homeBtn">‹ หน้าแรก</button><div class="formTitle">${viewTitleFor(currentView)}</div></div>`;
  document.getElementById('homeBtn').onclick=()=>goTo('home');
  if(currentView==='caregiver') await renderCaregiverView();
  else if(currentView==='admin') await renderAdminView();
  else if(currentView==='dashboard') await renderDashboardView();
}

/* ============== CHIP HELPER ============== */
function chipGroup(container, options, selectedValue, onChange, multi){
  container.innerHTML='';
  container.className='chips';
  const sel = multi ? new Set(selectedValue||[]) : {v:selectedValue||null};
  options.forEach(opt=>{
    const b=document.createElement('button');
    b.type='button'; b.className='chip'; b.textContent=opt;
    if(multi ? sel.has(opt) : sel.v===opt) b.classList.add('selected');
    if(opt==='มีแผล'||opt==='สำลัก'||opt==='มีเลือดปน'||opt==='ไม่ได้ให้'||opt==='มีคำสั่ง DNR') b.classList.add('warn');
    b.onclick=()=>{
      if(multi){
        if(sel.has(opt)) sel.delete(opt); else sel.add(opt);
        onChange(Array.from(sel));
      } else {
        sel.v = sel.v===opt ? null : opt;
        onChange(sel.v);
      }
      chipGroup(container, options, multi?Array.from(sel):sel.v, onChange, multi);
    };
    container.appendChild(b);
  });
}

/* ============== CAREGIVER VIEW ============== */
function patientInfoBanner(p){
  if(!p) return '';
  const bits=[];
  if(p.conditions) bits.push('โรคประจำตัว: '+p.conditions);
  if(p.foodAllergy) bits.push('แพ้อาหาร: '+p.foodAllergy);
  if(p.drugAllergy) bits.push('แพ้ยา: '+p.drugAllergy);
  if(p.dnr==='มีคำสั่ง DNR') bits.push('มีคำสั่ง DNR');
  if(bits.length===0) return '';
  const warn = p.dnr==='มีคำสั่ง DNR' || p.foodAllergy || p.drugAllergy;
  return `<div class="section"><div class="infoBanner ${warn?'warn':''}">${bits.join(' · ')}</div></div>`;
}

function renderPatientPicker(container){
  if(patients.length===0){ container.innerHTML='<div class="empty">ยังไม่มีรายชื่อผู้สูงอายุ กรุณาแจ้งแอดมิน</div>'; return; }
  container.innerHTML = patients.map(p=>`
    <button type="button" class="pickRow ${cgState.patientId===p.id?'picked':''}" data-id="${p.id}">
      <span class="prName">${p.name}</span>
      <span class="prMeta">${p.age?('อายุ '+p.age+' ปี'):''}</span>
    </button>`).join('');
  container.querySelectorAll('.pickRow').forEach(btn=>{
    btn.onclick=()=>{
      cgState.patientId = btn.dataset.id;
      cgState.action=null;
      renderCaregiverView();
    };
  });
}

async function renderCaregiverView(){
  await ensureData();
  const el = document.getElementById('mainContent');
  if(!apiConfigured()){
    el.innerHTML = `<div class="section"><div class="card"><div class="empty">ยังไม่ได้ตั้งค่าเชื่อมต่อฐานข้อมูล<br>กรุณาแจ้งแอดมินให้ใส่ Web app URL ของ Google Apps Script ในไฟล์นี้ก่อนใช้งาน (ตัวแปร CONFIG.API_URL)</div></div></div>`;
    return;
  }
  const patient = patients.find(p=>p.id===cgState.patientId);
  el.innerHTML = `
    <div class="section">
      <div class="card">
        <h2><span class="dot"></span>เลือกผู้สูงอายุ</h2>
        <div id="patientPicker"></div>
      </div>
    </div>
    ${cgState.patientId ? `
    <div class="section">
      <div class="card">
        <h2><span class="dot"></span>ผู้บันทึก (ผู้ดูแล)</h2>
        <div id="caregiverPicker"></div>
      </div>
    </div>` : ''}
    ${patient ? patientInfoBanner(patient) : ''}
    <div id="cgDynamic"></div>
  `;
  renderPatientPicker(document.getElementById('patientPicker'));
  if(cgState.patientId){
    const cgPicker = document.getElementById('caregiverPicker');
    if(caregivers.length===0){
      cgPicker.innerHTML = '<div class="empty">ยังไม่มีรายชื่อผู้ดูแล กรุณาแจ้งแอดมิน</div>';
    } else {
      chipGroup(cgPicker, caregivers.map(c=>c.name), cgState.caregiverName, v=>{ cgState.caregiverName=v; renderCaregiverView(); });
    }
  }
  renderCgDynamic();
}

function renderCgDynamic(){
  const wrap=document.getElementById('cgDynamic');
  if(!wrap) return;
  if(!cgState.patientId){ wrap.innerHTML=''; return; }
  if(cgState.action){ renderActionForm(wrap, cgState.action); }
  else { renderActionHome(wrap); }
}

function actionButtonHtml(action,icon,label){

function feedIcon(type){ return {vitals:'🫀',excretion:'🚻',meal:'🍽️',medication:'💊',wound:'🩹',mood:'🙂',note:'📝'}[type]||'•'; }
function feedSummary(r){
  if(r.type==='vitals') return `BP ${r.sys||'-'}/${r.dia||'-'} · PR ${r.pulse||'-'} · T ${r.temp||'-'}°C · O2 ${r.spo2||'-'}%${r.dtx?(' · DTX '+r.dtx):''}`;
  if(r.type==='excretion') return `ปัสสาวะ: ${r.urine||'-'} · อุจจาระ: ${r.stool||'-'}`;
  if(r.type==='meal') return `มื้อ${r.mealSlot||'-'}: ${r.foodItems||'-'} (${r.amount||'-'})${r.choke==='สำลัก'?' ⚠️ สำลัก':''}`;
  if(r.type==='medication'){
    const items=r.medItems||[];
    const missed=items.filter(i=>i.status==='ไม่ได้ให้');
    return `มื้อ${r.medSlot||'-'}: ${items.map(i=>i.name).join(', ')||'-'}${missed.length?(' · ไม่ได้ให้ '+missed.length+' รายการ'):''}`;
  }
  if(r.type==='wound') return r.wound==='มีแผล' ? (r.woundDetail||'มีแผล') : 'ตรวจผิวหนัง: ไม่มีแผล';
  if(r.type==='mood') return (r.mood||[]).join(', ')||'-';
  if(r.type==='note') return r.notes||'-';
  return r.notes||'';
}
function feedFlag(r){
  if(r.type==='vitals'){
    const sys=Number(r.sys), pulse=Number(r.pulse), temp=Number(r.temp), spo2=Number(r.spo2);
    return (r.sys&&(sys>=140||sys<=90)) || (r.pulse&&(pulse>=100||pulse<=50)) || (r.temp&&temp>=37.5) || (r.spo2&&spo2>0&&spo2<95);
  }
  if(r.type==='meal') return r.choke==='สำลัก';
  if(r.type==='medication') return (r.medItems||[]).some(i=>i.status==='ไม่ได้ให้');
  if(r.type==='wound') return r.wound==='มีแผล';
  return false;
}

async function renderFeed(){

async function submitTypedRecord(type, extra){
  if(!cgState.caregiverName){ showToast('กรุณาเลือกชื่อผู้ดูแลก่อนบันทึก'); return; }
  const record = Object.assign({
    patientId: cgState.patientId,
    type,
    date: todayStr(),
    time: nowTime(),
    caregiverName: cgState.caregiverName,
  }, extra);
  const btn=document.getElementById('actSubmitBtn');
  if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก...'; }
  const result = await apiPost('addRecord', record);
  if(result && result.success){
    showToast('บันทึกข้อมูลเรียบร้อย');
    cgState.action=null;
    renderCgDynamic();
  } else if(btn){
    btn.disabled=false; btn.textContent='บันทึกข้อมูล';
  }
}

async function buildMedicationForm(card){
  card.innerHTML = '<div class="empty">กำลังโหลดรายการยา...</div>';
  const meds = await apiGet('getMedications', {patientId: cgState.patientId});
  if(!card.isConnected) return;
  let slot=null;
  const rowsState = {};

  function render(){
    const relevant = meds.filter(m=> !slot || !m.timeSlots || !m.timeSlots.length || m.timeSlots.includes(slot));
    card.innerHTML = `
      <label>มื้อยา</label>
      <div id="md_slot"></div>
      ${meds.length===0 ? '<div class="hint">ยังไม่ได้ตั้งค่ารายการยาประจำของผู้สูงอายุคนนี้ กรุณาแจ้งแอดมิน หรือกรอกยาที่ให้ด้านล่างแทน</div>' : ''}
      <div id="md_list" style="margin-top:10px;"></div>
      <label>ยาอื่นๆ ที่ให้ (ถ้ามีนอกรายการ)</label>
      <input type="text" id="md_extra" placeholder="ชื่อยา, ขนาด">
      <label>หมายเหตุ</label>
      <textarea id="md_notes" placeholder="ถ้ามี"></textarea>
      <button class="btn btn-primary" id="actSubmitBtn" style="margin-top:14px;">บันทึกข้อมูล</button>
    `;
    chipGroup(document.getElementById('md_slot'), ['เช้า','เที่ยง','เย็น','ก่อนนอน'], slot, v=>{ slot=v; render(); });

    const listEl=document.getElementById('md_list');
    if(relevant.length){
      listEl.innerHTML = relevant.map(m=>`
        <div class="medRow" data-id="${m.id}">
          <div class="mname">${m.name}</div>
          <div class="mdose">${m.dose||''}</div>
          <div class="medStatusRow"></div>
        </div>`).join('');
      relevant.forEach(m=>{
        const row = listEl.querySelector('.medRow[data-id="'+m.id+'"] .medStatusRow');
        chipGroup(row, ['ให้แล้ว','ไม่ได้ให้'], rowsState[m.id]||'ให้แล้ว', v=>{ rowsState[m.id]=v; });
      });
    }

    document.getElementById('actSubmitBtn').onclick = ()=>{
      const medItems = relevant.map(m=>({name: m.name + (m.dose?(' '+m.dose):''), status: rowsState[m.id]||'ให้แล้ว'}));
      const extra = document.getElementById('md_extra').value.trim();
      if(extra) medItems.push({name: extra, status:'ให้แล้ว'});
      if(medItems.length===0){ showToast('กรุณาระบุยาที่ให้อย่างน้อย 1 รายการ'); return; }
      submitTypedRecord('medication', {medSlot: slot||'', medItems, notes: document.getElementById('md_notes').value||''});
    };
  }
  render();
}

function visitLine(r, content){
  return `<div class="rc-visit"><div class="t">${r.time} น.</div><div class="row">${content}</div>${r.notes?`<div class="rc-note" style="margin-top:4px;">หมายเหตุ: ${r.notes}</div>`:''}<div class="who">บันทึกโดย ${r.caregiverName}</div></div>`;
}
function patientAlertLine(p){
  if(!p) return '';
  const bits=[];
  if(p.conditions) bits.push('โรคประจำตัว: '+p.conditions);
  if(p.foodAllergy) bits.push('แพ้อาหาร: '+p.foodAllergy);
  if(p.drugAllergy) bits.push('แพ้ยา: '+p.drugAllergy);
  if(p.dnr==='มีคำสั่ง DNR') bits.push('มีคำสั่ง DNR');
  if(bits.length===0) return '';
  return `<div class="rc-alert">${bits.join(' · ')}</div>`;
}

async function buildReport(){

  const wrap = document.getElementById('reportWrap');

  actions.style.display = 'block';

  const vitalsRows = records.filter(r=>r.type==='vitals');
  const excretionRows = records.filter(r=>r.type==='excretion');
  const mealRows = records.filter(r=>r.type==='meal');

  const woundRows = records.filter(r=>r.type==='wound' && r.wound==='มีแผล');
  const moodRows = records.filter(r=>r.type==='mood' && r.mood && r.mood.length);
  const noteRows = records.filter(r=>r.type==='note' && r.notes);

  wrap.innerHTML = `
    <div id="reportCard">
      <div class="rc-head">
        <div class="rc-brand">CMCC โฮมแคร์ · บันทึกการดูแลประจำวัน</div>
        <div class="rc-name">${patient ? patient.name : '-'}</div>
        <div class="rc-sub">${patient && patient.age ? 'อายุ '+patient.age+' ปี' : ''}${patient && patient.gender ? ' · '+patient.gender : ''} · ${fmtDate(date)}</div>
        ${patient ? patientAlertLine(patient) : ''}
      </div>
      <div class="rc-body">
        ${records.length===0 ? '<div class="empty">ไม่มีข้อมูลการบันทึกในวันนี้</div>' : `
        ${vitalsRows.length?`<div class="rc-sec"><div class="rc-sec-title">สัญญาณชีพ</div>
          ${vitalsRows.map(r=>visitLine(r, `
            <span>BP ${r.sys||'-'}/${r.dia||'-'}</span>
            <span>PR ${r.pulse||'-'}</span>
            <span>T ${r.temp||'-'}°C</span>
            <span>O2 ${r.spo2||'-'}%</span>
          `)).join('')}
        </div>`:''}

        ${excretionRows.length?`<div class="rc-sec"><div class="rc-sec-title">การขับถ่าย</div>
          ${excretionRows.map(r=>visitLine(r, `<span>ปัสสาวะ: ${r.urine||'-'}</span><span>อุจจาระ: ${r.stool||'-'}</span>`)).join('')}
        </div>`:''}

        ${mealRows.length?`<div class="rc-sec"><div class="rc-sec-title">มื้ออาหาร</div>
          ${mealRows.map(r=>visitLine(r, `<span>มื้อ${r.mealSlot||'-'}: ${r.foodItems||'-'}</span><span>${r.amount||'-'}${r.choke==='สำลัก'?' ⚠️':''}</span>`)).join('')}
        </div>`:''}

        ${medRows.length?`<div class="rc-sec"><div class="rc-sec-title">มื้อยา</div>
          ${medRows.map(r=>{
            const items=r.medItems||[];
            return `<div class="rc-visit"><div class="t">${r.time} น. · มื้อ${r.medSlot||'-'}</div>
              ${items.map(i=>`<div class="row"><span>${i.name}</span><span>${i.status}</span></div>`).join('')}
              ${r.notes?`<div class="rc-note" style="margin-top:4px;">หมายเหตุ: ${r.notes}</div>`:''}
              <div class="who">บันทึกโดย ${r.caregiverName}</div>
            </div>`;
          }).join('')}
        </div>`:''}

        ${woundRows.length?`<div class="rc-sec"><div class="rc-sec-title">ผิวหนัง / แผลกดทับ</div>
          ${woundRows.map(r=>visitLine(r, `<span>${r.woundDetail||'มีแผล'}</span>`)).join('')}
        </div>`:''}

        ${moodRows.length?`<div class="rc-sec"><div class="rc-sec-title">สภาวะจิตใจและอารมณ์</div>
          ${moodRows.map(r=>visitLine(r, `<span>${r.mood.join(', ')}</span>`)).join('')}
        </div>`:''}

        ${noteRows.length?`<div class="rc-sec"><div class="rc-sec-title">บันทึกทั่วไปจากผู้ดูแล</div>
          ${noteRows.map(r=>`<div class="rc-note">${r.time} น. (${r.caregiverName}): ${r.notes}</div>`).join('')}
        </div>`:''}
        `}
      </div>
      <div class="rc-foot">
        <span>จัดทำโดย CMCC โฮมแคร์</span>
        <span>พิมพ์เมื่อ ${todayStr()}</span>
      </div>
    </div>
  `;

  document.getElementById('downloadPngBtn').onclick = ()=>{
    html2canvas(document.getElementById('reportCard'), {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
      const link=document.createElement('a');
      link.download = `${patient?patient.name:'report'}-${date}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  };
  document.getElementById('printBtn').onclick = ()=> window.print();
}

async function loadMedList(pid){
  const wrap=document.getElementById('medList');
  if(!wrap) return;
  if(!pid){ wrap.innerHTML='<div class="empty">เลือกผู้สูงอายุก่อนเพื่อดูรายการยา</div>'; return; }
  wrap.innerHTML='<div class="empty">กำลังโหลด...</div>';
  const meds = await apiGet('getMedications', {patientId:pid});
  if(!document.getElementById('medList')) return;
  if(meds.length===0){ wrap.innerHTML='<div class="empty">ยังไม่มีรายการยา</div>'; return; }
  wrap.innerHTML = meds.map(m=>`
    <div class="listRow">
      <div><div class="name">${m.name}</div><div class="meta">${m.dose||''}${m.timeSlots && m.timeSlots.length ? (' · '+m.timeSlots.join(', ')) : ''}</div></div>
      <button class="iconbtn" data-id="${m.id}">ลบ</button>
    </div>`).join('');
  wrap.querySelectorAll('.iconbtn').forEach(btn=>{
    btn.onclick=async()=>{
      const r=await apiPost('deleteMedication', {id:btn.dataset.id});
      if(r && r.success) loadMedList(pid);
    };
  });
}

function renderPatientList(){
  const wrap=document.getElementById('patientList');
  if(patients.length===0){ wrap.innerHTML='<div class="empty">ยังไม่มีรายชื่อ</div>'; return; }
  wrap.innerHTML = patients.map(p=>`
    <div class="listRow">
      <div>
        <div class="name">${p.name}</div>
        <div class="meta">${p.gender||''}${p.age?(' · อายุ '+p.age+' ปี'):''}${p.dnr==='มีคำสั่ง DNR'?' · DNR':''}${(p.foodAllergy||p.drugAllergy)?' · มีประวัติแพ้':''}</div>
      </div>
      <button class="iconbtn" data-id="${p.id}">ลบ</button>
    </div>`).join('');
  wrap.querySelectorAll('.iconbtn').forEach(btn=>{
    btn.onclick=async()=>{
      const result = await apiPost('deletePatient', {id:btn.dataset.id});
      if(result && result.success){
        patients = patients.filter(p=>p.id!==btn.dataset.id);
        renderPatientList();
      }
    };
  });
}
function renderCaregiverList(){
  const wrap=document.getElementById('caregiverList');
  if(caregivers.length===0){ wrap.innerHTML='<div class="empty">ยังไม่มีรายชื่อ</div>'; return; }
  wrap.innerHTML = caregivers.map(c=>`
    <div class="listRow">
      <div class="name">${c.name}</div>
      <button class="iconbtn" data-id="${c.id}">ลบ</button>
    </div>`).join('');
  wrap.querySelectorAll('.iconbtn').forEach(btn=>{
    btn.onclick=async()=>{
      const result = await apiPost('deleteCaregiver', {id:btn.dataset.id});
      if(result && result.success){
        caregivers = caregivers.filter(c=>c.id!==btn.dataset.id);
        renderCaregiverList();
      }
    };
  });
}

/* ============== DASHBOARD VIEW ============== */
function dashRowHtml(p){
  const badges=[];
  if(p.entryCount===0) badges.push('<span class="badge badge-neutral">ยังไม่บันทึกวันนี้</span>');
  if(p.vitalsFlags && p.vitalsFlags.length) p.vitalsFlags.forEach(f=>badges.push(`<span class="badge badge-warn">${f}</span>`));
  if(p.medMissed) badges.push('<span class="badge badge-warn">ให้ยาไม่ครบ</span>');
  if(p.woundFlag) badges.push('<span class="badge badge-warn">มีแผล</span>');
  if(p.entryCount>0 && badges.length===0) badges.push('<span class="badge badge-ok">ปกติดี</span>');
  return `
    <div class="dashRow" data-id="${p.patientId}">
      <div class="name">${p.patientName}</div>
      <div class="sub">${p.entryCount} รายการวันนี้${p.lastTime?(' · ล่าสุด '+p.lastTime+' น.'):''}</div>
      <div>${badges.join('')}</div>
    </div>`;
}

async function renderDashboardView(){
  await ensureData();
  const el = document.getElementById('mainContent');
  if(!apiConfigured()){
    el.innerHTML = `<div class="section"><div class="card"><div class="empty">ยังไม่ได้ตั้งค่าเชื่อมต่อฐานข้อมูล</div></div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="section">
      <div class="card">
        <label>วันที่</label>
        <input type="date" id="d_date" value="${todayStr()}">
      </div>
    </div>
    <div id="dashBody" class="section"><div class="empty">กำลังโหลด...</div></div>
  `;
  document.getElementById('d_date').onchange = buildDashboard;
  buildDashboard();
}

async function buildDashboard(){
  const date=document.getElementById('d_date').value;
  const body=document.getElementById('dashBody');
  body.innerHTML='<div class="empty">กำลังโหลด...</div>';
  const data = await apiGet('getDashboard', {date});
  const list = (data && data.patients) || [];
  const total = list.length;
  const withEntry = list.filter(p=>p.entryCount>0).length;
  const alerts = list.filter(p=> (p.vitalsFlags&&p.vitalsFlags.length) || p.medMissed || p.woundFlag).length;
  if(!document.getElementById('dashBody')) return;
  body.innerHTML = `
    <div class="dashSummary">
      <div class="box"><div class="num">${total}</div><div class="lb">ผู้สูงอายุทั้งหมด</div></div>
      <div class="box"><div class="num">${withEntry}</div><div class="lb">บันทึกแล้ววันนี้</div></div>
      <div class="box"><div class="num">${alerts}</div><div class="lb">ต้องติดตาม</div></div>
    </div>
    ${list.length===0 ? '<div class="empty">ยังไม่มีรายชื่อผู้สูงอายุ</div>' : list.map(dashRowHtml).join('')}
  `;
  body.querySelectorAll('.dashRow').forEach(row=>{
    row.onclick=async ()=>{
      adminTab='report';
      await goTo('admin');
      const sel=document.getElementById('r_patient');
      if(sel){ sel.value=row.dataset.id; buildReport(); }
    };
  });
}
